name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: swift --version
      - name: Core
        run: swift test
      - name: iOS build
        run: xcodebuild build -scheme IForevents -destination 'generic/platform=iOS' -skipPackagePluginValidation | tail -3
      - name: Adapters
        run: |
          for a in Adapters/IForeventsMixpanel Adapters/IForeventsAmplitude; do (cd "$a" && swift test); done
          (cd Adapters/IForeventsFirebase && swift build)
      - name: Smoke
        if: ${{ github.event_name == 'push' && env.IFOREVENTS_PROJECT_KEY != '' }}
        env:
          IFOREVENTS_PROJECT_KEY: ${{ secrets.SMOKE_PROJECT_KEY }}
          IFOREVENTS_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://api.iforevents.com' }}
        run: swift test --filter SmokeTests
